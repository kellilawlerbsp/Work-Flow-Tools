<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driftwood — Financial Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', system-ui, sans-serif; background: #0f1117; color: #f0f2ff; min-height: 100vh; padding: 24px 20px 80px; }
.wrap { max-width: 820px; margin: 0 auto; }

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.header-eyebrow { font-size: 11px; color: #2dd4bf; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; }
.header-h1 { font-size: 26px; font-weight: 800; font-family: Georgia, serif; line-height: 1.1; }
.header-sub { font-size: 12px; color: #8b8fa8; margin-top: 3px; }
.btn-primary { background: linear-gradient(135deg, #2dd4bf, #60b4ff); border: none; border-radius: 12px; color: #0f1117; padding: 10px 18px; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit; }

/* SUMMARY CARDS */
.summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
.sum-card { background: #1a1d27; border: 1px solid #2e3250; border-radius: 14px; padding: 16px; text-align: center; }
.sum-num { font-size: 26px; font-weight: 800; font-family: Georgia, serif; line-height: 1; margin-bottom: 4px; }
.sum-lbl { font-size: 11px; color: #8b8fa8; text-transform: uppercase; letter-spacing: 0.5px; }

/* PIPELINE */
.pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-bottom: 20px; background: #1a1d27; border: 1px solid #2e3250; border-radius: 14px; overflow: hidden; }
.pipe-stage { padding: 14px 12px; border-right: 1px solid #2e3250; }
.pipe-stage:last-child { border-right: none; }
.pipe-label { font-size: 10px; color: #8b8fa8; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 8px; }
.pipe-amount { font-size: 20px; font-weight: 800; font-family: Georgia, serif; line-height: 1; }
.pipe-count { font-size: 11px; color: #8b8fa8; margin-top: 3px; }
.pipe-bar { height: 3px; border-radius: 2px; margin-top: 8px; }

/* SECTION */
.section { background: #1a1d27; border: 1px solid #2e3250; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #8b8fa8; }
.btn-small { background: #21253a; border: 1px solid #2e3250; border-radius: 8px; color: #8b8fa8; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
.btn-small:hover { border-color: #2dd4bf; color: #2dd4bf; }

/* TABLE */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #8b8fa8; padding: 8px 10px; border-bottom: 1px solid #2e3250; }
.data-table td { padding: 10px 10px; border-bottom: 1px solid #1a1d27; vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #21253a88; }

/* STATUS PILLS */
.pill { display: inline-block; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
.pill-logged   { background: rgba(96,180,255,0.15); color: #60b4ff; border: 1px solid rgba(96,180,255,0.3); }
.pill-po       { background: rgba(255,179,71,0.15); color: #ffb347; border: 1px solid rgba(255,179,71,0.3); }
.pill-paid     { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
.pill-reconciled { background: rgba(45,212,191,0.15); color: #2dd4bf; border: 1px solid rgba(45,212,191,0.3); }
.pill-overdue  { background: rgba(255,77,109,0.15); color: #ff4d6d; border: 1px solid rgba(255,77,109,0.3); }

/* ACTION BTNS */
.action-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 2px 4px; opacity: 0.6; }
.action-btn:hover { opacity: 1; }

/* MODAL */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; display: none; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: #1a1d27; border-radius: 18px; padding: 28px; width: 100%; max-width: 460px; border: 1px solid #2e3250; margin: 20px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 17px; font-weight: 800; margin-bottom: 20px; }
.modal-label { font-size: 11px; color: #8b8fa8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
.modal-input, .modal-select { width: 100%; background: #0f1117; border: 1px solid #2e3250; border-radius: 8px; color: #f0f2ff; padding: 8px 12px; font-size: 14px; margin-bottom: 14px; font-family: inherit; outline: none; }
.modal-input:focus, .modal-select:focus { border-color: #2dd4bf; }
.modal-footer { display: flex; gap: 10px; margin-top: 8px; }
.btn-cancel { flex: 1; background: transparent; border: 1px solid #2e3250; color: #8b8fa8; border-radius: 10px; padding: 10px; cursor: pointer; font-family: inherit; }
.btn-confirm { flex: 2; background: #2dd4bf; border: none; color: #0f1117; border-radius: 10px; padding: 10px; cursor: pointer; font-family: inherit; font-weight: 800; }

/* SAVE BAR */
.save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1d27; border-top: 1px solid #2e3250; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
.save-bar-text { font-size: 12px; color: #8b8fa8; }
.autosave { font-size: 11px; color: #4ade80; margin-left: 8px; }
.save-btns { display: flex; gap: 8px; }
.save-btns button { background: #21253a; border: 1px solid #2e3250; color: #8b8fa8; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-family: inherit; font-size: 12px; }
.save-btns button:hover { border-color: #2dd4bf; color: #2dd4bf; }

.empty-state { text-align: center; color: #8b8fa8; padding: 30px; font-size: 13px; }
.progress-bar { height: 6px; background: #2e3250; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

@media (max-width: 600px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .pipeline { grid-template-columns: repeat(2, 1fr); }
  .pipe-stage:nth-child(2) { border-right: none; }
  .pipe-stage:nth-child(3) { border-right: 1px solid #2e3250; border-top: 1px solid #2e3250; }
  .pipe-stage:nth-child(4) { border-top: 1px solid #2e3250; }
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="header-eyebrow">Driftwood Therapeutic Supports</div>
      <div class="header-h1">Financial Tracker</div>
      <div class="header-sub">Splose hours → Purchase order → Bank → Xero</div>
    </div>
    <button class="btn-primary" onclick="openModal()">＋ Add Fortnight</button>
  </div>

  <!-- SUMMARY -->
  <div class="summary-grid" id="summary-grid"></div>

  <!-- PIPELINE -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">💰 Income Pipeline</div>
    </div>
    <div class="pipeline" id="pipeline"></div>
  </div>

  <!-- FORTNIGHTS TABLE -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">📋 Fortnight Records</div>
      <div style="display:flex;gap:8px;">
        <select id="filter-status" class="btn-small" onchange="render()" style="cursor:pointer;">
          <option value="all">All status</option>
          <option value="logged">Hours logged</option>
          <option value="po">PO received</option>
          <option value="paid">Paid</option>
          <option value="reconciled">Reconciled</option>
        </select>
      </div>
    </div>
    <div id="records-table"></div>
  </div>

  <!-- ANNUAL TRACKER -->
  <div class="section">
    <div class="section-header">
      <div class="section-title">📈 FY Progress</div>
    </div>
    <div id="fy-progress"></div>
  </div>

</div>

<!-- SAVE BAR -->
<div class="save-bar">
  <div class="save-bar-text">
    Auto-saves to this browser
    <span class="autosave" id="autosave"></span>
  </div>
  <div class="save-btns">
    <button onclick="document.getElementById('load-file').click()">⬆ Load backup</button>
    <input type="file" id="load-file" accept=".json" style="display:none" onchange="loadBackup(event)">
    <button onclick="saveBackup()">⬇ Save backup</button>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-bg" id="modal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title">➕ New Fortnight Record</div>

    <label class="modal-label">Fortnight period</label>
    <input class="modal-input" type="text" id="m-period" placeholder="e.g. 12–25 May 2026">

    <label class="modal-label">Hours logged in Splose</label>
    <input class="modal-input" type="number" id="m-hours" placeholder="e.g. 32.5" step="0.5" min="0">

    <label class="modal-label">Your contracted rate ($/hr)</label>
    <input class="modal-input" type="number" id="m-rate" placeholder="e.g. 145.00" step="0.01" min="0">

    <label class="modal-label">Status</label>
    <select class="modal-select" id="m-status">
      <option value="logged">Hours logged in Splose</option>
      <option value="po">Purchase order received</option>
      <option value="paid">Payment received in bank</option>
      <option value="reconciled">Reconciled in Xero</option>
    </select>

    <label class="modal-label">PO number (when received)</label>
    <input class="modal-input" type="text" id="m-po" placeholder="e.g. PO-2026-043">

    <label class="modal-label">Date paid (when applicable)</label>
    <input class="modal-input" type="date" id="m-date-paid">

    <label class="modal-label">Notes</label>
    <input class="modal-input" type="text" id="m-notes" placeholder="Optional">

    <div class="modal-footer">
      <button class="btn-cancel" onclick="document.getElementById('modal').classList.remove('open')">Cancel</button>
      <button class="btn-confirm" onclick="saveRecord()">Save Record</button>
    </div>
  </div>
</div>

<script>
var records = [];
var editId = null;
var RATE_DEFAULT = 145;

var STATUS_CFG = {
  logged:     { label: 'Hours logged',   pill: 'pill-logged',     color: '#60b4ff', next: 'po' },
  po:         { label: 'PO received',    pill: 'pill-po',         color: '#ffb347', next: 'paid' },
  paid:       { label: 'Paid',           pill: 'pill-paid',       color: '#4ade80', next: 'reconciled' },
  reconciled: { label: 'Reconciled',     pill: 'pill-reconciled', color: '#2dd4bf', next: null },
};

function fmt(n) { return '$' + Number(n||0).toLocaleString('en-AU', {minimumFractionDigits:2, maximumFractionDigits:2}); }

// ── STORAGE ───────────────────────────────────────────
function save() {
  localStorage.setItem('driftwood_finance', JSON.stringify(records));
  var el = document.getElementById('autosave');
  el.textContent = '✓ Saved';
  setTimeout(function() { el.textContent = ''; }, 2000);
}
function load() {
  try {
    var raw = localStorage.getItem('driftwood_finance');
    if (raw) records = JSON.parse(raw);
  } catch(e) {}
  if (!records || records.length === 0) records = defaultRecords();
}
function defaultRecords() {
  return [
    { id:1, period:'28 Apr – 11 May 2026', hours:34, rate:145, status:'reconciled', po:'PO-2026-031', datePaid:'2026-05-09', notes:'' },
    { id:2, period:'12–25 May 2026',        hours:28, rate:145, status:'po',         po:'PO-2026-038', datePaid:'', notes:'' },
    { id:3, period:'26 May – 8 Jun 2026',   hours:0,  rate:145, status:'logged',     po:'', datePaid:'', notes:'In progress' },
  ];
}
function saveBackup() {
  var blob = new Blob([JSON.stringify({ version:'1.0', records: records }, null, 2)], { type:'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'driftwood_finance_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function loadBackup(e) {
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (data.records) { records = data.records; save(); render(); }
    } catch(err) { alert('Could not read backup file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── MODAL ─────────────────────────────────────────────
function openModal(id) {
  editId = id || null;
  var r = id ? records.find(function(x){return x.id===id;}) : null;
  document.getElementById('modal-title').textContent = id ? '✏️ Edit Record' : '➕ New Fortnight Record';
  document.getElementById('m-period').value   = r ? r.period : '';
  document.getElementById('m-hours').value    = r ? r.hours : '';
  document.getElementById('m-rate').value     = r ? r.rate : RATE_DEFAULT;
  document.getElementById('m-status').value   = r ? r.status : 'logged';
  document.getElementById('m-po').value       = r ? r.po : '';
  document.getElementById('m-date-paid').value= r ? r.datePaid : '';
  document.getElementById('m-notes').value    = r ? r.notes : '';
  document.getElementById('modal').classList.add('open');
}
function closeModal(e) { if (e.target === document.getElementById('modal')) document.getElementById('modal').classList.remove('open'); }

function saveRecord() {
  var period = document.getElementById('m-period').value.trim();
  var hours  = parseFloat(document.getElementById('m-hours').value) || 0;
  var rate   = parseFloat(document.getElementById('m-rate').value) || RATE_DEFAULT;
  if (!period) { alert('Please enter a period.'); return; }

  var rec = {
    id: editId || Date.now(),
    period: period,
    hours: hours,
    rate: rate,
    status: document.getElementById('m-status').value,
    po: document.getElementById('m-po').value.trim(),
    datePaid: document.getElementById('m-date-paid').value,
    notes: document.getElementById('m-notes').value.trim(),
  };

  if (editId) {
    records = records.map(function(r){ return r.id === editId ? rec : r; });
  } else {
    records.push(rec);
  }

  document.getElementById('modal').classList.remove('open');
  save();
  render();
}

function advanceStatus(id) {
  records = records.map(function(r) {
    if (r.id !== id) return r;
    var next = STATUS_CFG[r.status] && STATUS_CFG[r.status].next;
    return next ? Object.assign({}, r, { status: next }) : r;
  });
  save(); render();
}

function deleteRecord(id) {
  if (!confirm('Delete this record?')) return;
  records = records.filter(function(r){ return r.id !== id; });
  save(); render();
}

// ── RENDER ────────────────────────────────────────────
function render() {
  renderSummary();
  renderPipeline();
  renderTable();
  renderFY();
}

function renderSummary() {
  var paid = records.filter(function(r){ return r.status==='paid'||r.status==='reconciled'; });
  var paidAmt = paid.reduce(function(a,r){ return a + r.hours*r.rate; }, 0);
  var pending = records.filter(function(r){ return r.status==='logged'||r.status==='po'; });
  var pendingAmt = pending.reduce(function(a,r){ return a + r.hours*r.rate; }, 0);
  var unreconciled = records.filter(function(r){ return r.status==='paid'; });
  var unreconciledAmt = unreconciled.reduce(function(a,r){ return a + r.hours*r.rate; }, 0);
  var totalHrs = records.reduce(function(a,r){ return a + (r.hours||0); }, 0);

  var cards = [
    { label: 'Income received', num: fmt(paidAmt), color: '#4ade80' },
    { label: 'Awaiting payment', num: fmt(pendingAmt), color: '#ffb347' },
    { label: 'Not yet in Xero', num: fmt(unreconciledAmt), color: '#ff4d6d' },
    { label: 'Total hours logged', num: totalHrs.toFixed(1) + 'h', color: '#60b4ff' },
  ];
  document.getElementById('summary-grid').innerHTML = cards.map(function(c) {
    return '<div class="sum-card"><div class="sum-num" style="color:' + c.color + ';">' + c.num + '</div><div class="sum-lbl">' + c.label + '</div></div>';
  }).join('');
}

function renderPipeline() {
  var stages = ['logged','po','paid','reconciled'];
  var labels = ['Hours logged', 'PO received', 'Paid to bank', 'In Xero'];
  var colors = ['#60b4ff','#ffb347','#4ade80','#2dd4bf'];
  var html = '';
  stages.forEach(function(s, i) {
    var recs = records.filter(function(r){ return r.status===s; });
    var amt = recs.reduce(function(a,r){ return a + r.hours*r.rate; }, 0);
    html += '<div class="pipe-stage">';
    html += '<div class="pipe-label">' + labels[i] + '</div>';
    html += '<div class="pipe-amount" style="color:' + colors[i] + ';">' + fmt(amt) + '</div>';
    html += '<div class="pipe-count">' + recs.length + ' fortnight' + (recs.length!==1?'s':'') + '</div>';
    html += '<div class="pipe-bar" style="background:' + colors[i] + '33;"><div style="height:3px;border-radius:2px;background:' + colors[i] + ';width:' + (amt>0?'100':'0') + '%;"></div></div>';
    html += '</div>';
  });
  document.getElementById('pipeline').innerHTML = html;
}

function renderTable() {
  var filterStatus = document.getElementById('filter-status').value;
  var filtered = records.filter(function(r){ return filterStatus==='all' || r.status===filterStatus; });

  if (filtered.length === 0) {
    document.getElementById('records-table').innerHTML = '<div class="empty-state">No records yet. Click + Add Fortnight to get started.</div>';
    return;
  }

  var html = '<table class="data-table"><thead><tr>';
  html += '<th>Period</th><th>Hours</th><th>Amount</th><th>PO</th><th>Status</th><th>Date paid</th><th>Actions</th>';
  html += '</tr></thead><tbody>';

  filtered.forEach(function(r) {
    var cfg = STATUS_CFG[r.status] || STATUS_CFG.logged;
    var amt = r.hours * r.rate;
    var nextLabel = cfg.next ? 'Mark as ' + STATUS_CFG[cfg.next].label : '';
    html += '<tr>';
    html += '<td style="font-weight:600;">' + r.period + (r.notes ? '<div style="font-size:11px;color:#8b8fa8;margin-top:2px;">' + r.notes + '</div>' : '') + '</td>';
    html += '<td>' + (r.hours||0).toFixed(1) + 'h</td>';
    html += '<td style="font-weight:700;color:#f0f2ff;">' + fmt(amt) + '</td>';
    html += '<td style="font-size:12px;color:#8b8fa8;">' + (r.po || '—') + '</td>';
    html += '<td><span class="pill ' + cfg.pill + '">' + cfg.label + '</span></td>';
    html += '<td style="font-size:12px;color:#8b8fa8;">' + (r.datePaid || '—') + '</td>';
    html += '<td style="white-space:nowrap;">';
    if (cfg.next) html += '<button class="action-btn" title="' + nextLabel + '" onclick="advanceStatus(' + r.id + ')">✅</button>';
    html += '<button class="action-btn" title="Edit" onclick="openModal(' + r.id + ')">✏️</button>';
    html += '<button class="action-btn" title="Delete" onclick="deleteRecord(' + r.id + ')">🗑</button>';
    html += '</td></tr>';
  });

  html += '</tbody></table>';
  document.getElementById('records-table').innerHTML = html;
}

function renderFY() {
  var FY_TARGET = 80000;
  var now = new Date();
  var fyStart = now.getMonth() >= 6 ? new Date(now.getFullYear(), 6, 1) : new Date(now.getFullYear()-1, 6, 1);
  var fyEnd = new Date(fyStart.getFullYear()+1, 5, 30);
  var daysTotal = (fyEnd - fyStart) / 86400000;
  var daysGone  = Math.min((now - fyStart) / 86400000, daysTotal);

  var ytdIncome = records
    .filter(function(r){ return r.status==='paid'||r.status==='reconciled'; })
    .reduce(function(a,r){ return a + r.hours*r.rate; }, 0);

  var ytdPct = Math.min(ytdIncome / FY_TARGET * 100, 100);
  var timePct = daysGone / daysTotal * 100;
  var onTrack = ytdIncome >= (FY_TARGET * timePct / 100);

  var fyLabel = 'FY' + fyStart.getFullYear().toString().slice(2) + '/' + fyEnd.getFullYear().toString().slice(2);

  var html = '<div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">';
  html += '<div style="font-size:13px;">' + fyLabel + ' income vs target (' + fmt(FY_TARGET) + ')</div>';
  html += '<div style="font-size:13px;font-weight:700;color:' + (onTrack?'#4ade80':'#ffb347') + ';">' + (onTrack ? '✓ On track' : '⚠ Behind pace') + '</div>';
  html += '</div>';
  html += '<div class="progress-bar" style="margin-bottom:8px;">';
  html += '<div class="progress-fill" style="width:' + ytdPct.toFixed(1) + '%;background:linear-gradient(90deg,#2dd4bf,#4ade80);"></div>';
  html += '</div>';
  html += '<div style="display:flex;justify-content:space-between;font-size:12px;color:#8b8fa8;">';
  html += '<span>Received: <strong style="color:#f0f2ff;">' + fmt(ytdIncome) + '</strong></span>';
  html += '<span>' + ytdPct.toFixed(0) + '% of target</span>';
  html += '<span>Remaining: <strong style="color:#f0f2ff;">' + fmt(Math.max(0,FY_TARGET-ytdIncome)) + '</strong></span>';
  html += '</div>';
  html += '<div style="margin-top:12px;font-size:11px;color:#8b8fa8;">Target is a guide only — update it to match your actual income plan. Does not include business expenses or tax set-aside.</div>';

  document.getElementById('fy-progress').innerHTML = html;
}

load();
render();
</script>
</body>
</html>
